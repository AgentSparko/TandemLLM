# The CPU test suites (CONTRIBUTING.md) on every pull request and push to main, as two jobs.
# cpu: each tests/test_*.py through tests/script_suite.py in a clean process, CUDA hidden, four files
# at a time. The engine's Python packages are the versions install.sh pins, with the CPU builds of
# torch and torchvision. A file that fails or runs no test fails the job; a file that prints
# `skipped: <why>` (a GPU kernel test) is listed. .github/cpu-suite-skip.txt names files left out
# here, one a line; it is empty.
# app: TandemApp (app/) installed with its host extra and no torch, then each app/tests/test_*.py
# through app/tests/script_suite.py, two files at a time; a file that fails or runs no test fails it.
# The page it installs is the one the dashboard job built (dashboard-dist.yml, OPS-246: the page is
# not in git); the checkout gets the same build after the install, for the tests that read it.
# The GPU tests in tests/gpu/ run on a DGX Spark (the run-gpu label).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: cpu suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install the engine's packages (CPU builds)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0
          python -m pip install numpy==2.3.5 safetensors==0.8.0 tokenizers==0.22.2 transformers==5.12.1 \
            huggingface-hub==1.30.0 pyyaml==6.0.1 pillow==11.3.0 jinja2==3.1.6 regex==2026.9.3 \
            pyarrow==25.0.1 triton==3.7.1 cryptography psutil pytest jsonschema zstandard

      - name: Run the CPU suite
        env:
          SUITE_JOBS: "4"
        run: |
          mkdir -p results/suite
          ls tests/test_*.py | grep -vxF -f .github/cpu-suite-skip.txt > results/suite/FILES
          xargs -P "$SUITE_JOBS" -I{} sh -c \
            'python tests/script_suite.py --all --timeout 900 --out results/suite/logs "$1" | tail -1 >> results/suite/RESULT' \
            _ {} < results/suite/FILES
          python - <<'PY'
          import re
          lines = open("results/suite/RESULT").read().splitlines()
          total = {"files": 0, "ok": 0, "fail": 0, "skipped": 0, "tests": 0}
          bad, skipped = [], []
          for line in lines:
              for k, v in re.findall(r"(\w+)=(\d+)", line):
                  total[k] += int(v)
              if "fail=1" in line:
                  bad += line.split(" -- ")[1].split()
              if "skipped=1" in line:
                  skipped += line.split("skipped: ")[1].split()
          print(" ".join(f"{k}={v}" for k, v in total.items()))
          for f in skipped:
              print("skipped", f)
          for f in bad:
              print(f"::error file={f}::{f} failed or ran no test (results/suite/logs)")
          raise SystemExit(1 if bad or total["files"] == 0 else 0)
          PY

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: cpu-suite-logs
          path: results/suite
          retention-days: 7

  dashboard:
    name: dashboard
    uses: ./.github/workflows/dashboard-dist.yml

  app:
    name: app suite
    needs: dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: The page from the dashboard job
        uses: actions/download-artifact@v4.1.8
        with:
          name: dashboard-dist
          path: ${{ runner.temp }}/dashboard-dist

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install TandemApp (no torch)
        run: |
          # build from a copy: a local build writes app/build and app/*.egg-info in place
          cp -R app "$RUNNER_TEMP/app-src"
          cp -R "$RUNNER_TEMP/dashboard-dist" "$RUNNER_TEMP/app-src/dashboard/dist"
          python3 "$RUNNER_TEMP/app-src/tools/dashboard_bundle.py" verify \
            "$RUNNER_TEMP/app-src/dashboard/dist" --expect "${{ needs.dashboard.outputs.bundle }}"
          python -m pip install --upgrade pip
          python -m pip install "$RUNNER_TEMP/app-src[host]" pytest jsonschema pyyaml
          python -c "import importlib.util as u, sys; sys.exit('torch is installed' if u.find_spec('torch') else 0)"
          test -z "$(git status --porcelain --ignored app)"
          cp -R "$RUNNER_TEMP/dashboard-dist" app/dashboard/dist

      - name: Run the app suite
        run: |
          set -o pipefail
          mkdir -p results/app-suite
          ls app/tests/test_*.py | xargs -P 2 -n 1 python app/tests/script_suite.py --all \
            --out results/app-suite/logs | tee results/app-suite/RESULT

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: app-suite-logs
          path: results/app-suite
          retention-days: 7
