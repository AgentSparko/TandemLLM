# The engine's CPU suite (CONTRIBUTING.md) on every pull request and push to main.
# cpu: tools/engine_suite.sh, each file tools/engine_tests.py lists (every tests/test_*.py but the
# pair tests, which need TandemApp beside the engine) through tests/script_suite.py in a clean
# process, CUDA hidden, four files at a time. The engine's Python packages are the versions
# install.sh pins, with the CPU builds of torch and torchvision. A file that fails or runs no test
# fails the job; a file that prints `skipped: <why>` (a GPU kernel test) is listed.
# .github/cpu-suite-skip.txt names files left out here, one a line; it is empty. No TandemApp is
# checked out or read (ENG-413 WP14): TandemApp's suite runs in its own repository (OPS-250), and the
# pair tests run on the box with TandemApp at its PIN (tools/pair_suite.sh).
# The GPU tests in tests/gpu/ run on a DGX Spark (the run-gpu label).
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: cpu suite
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install the engine's packages (CPU builds)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0
          python -m pip install numpy==2.3.5 safetensors==0.8.0 tokenizers==0.22.2 transformers==5.12.1 \
            huggingface-hub==1.30.0 pyyaml==6.0.1 pillow==11.3.0 jinja2==3.1.6 regex==2026.9.3 \
            pyarrow==25.0.1 triton==3.7.1 cryptography psutil pytest jsonschema zstandard

      - name: Run the CPU suite
        env:
          PY: python
          SUITE_JOBS: "4"
        run: bash tools/engine_suite.sh results/suite

      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: cpu-suite-logs
          path: results/suite
          retention-days: 7
