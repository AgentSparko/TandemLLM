# Builds TandemApp's page (app/dashboard/dist), which is not in git (OPS-246), and hands it to the
# jobs that package it. tests.yml calls it on every pull request and push to main, and its app job
# installs the wheel with this build inside; a release workflow calls it the same way. One build:
#   npm ci (the lockfile, exactly), then the type check and Vite (tools/dashboard_bundle.py build,
#   which also writes dist/bundle.json: the bundle's content hash, each file's sha256, the commit,
#   the lockfile's sha256 and the Node version)
#   vitest, with the build's own checks on the new dist/ (no mock code, relative paths, the budget)
#   the size budget: the gzip total of dist/ (pako, the same on every runner) over the budget in
#   app/dashboard/scripts/gzip-size.mjs fails the job and prints both
#   a second build into a temp folder must give the same bundle hash (reproducible)
#   the bundle as an artifact `dashboard-dist` (the folder) and as a release archive
#   `dashboard-bundle` (tandemapp-dashboard-<hash>.tar.gz and its .sha256)
name: dashboard-dist

on:
  workflow_call:
    outputs:
      bundle:
        description: "the bundle's content hash (sha256 of dist/, bundle.json)"
        value: ${{ jobs.build.outputs.bundle }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      bundle: ${{ steps.record.outputs.bundle }}
    defaults:
      run:
        working-directory: app/dashboard
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2

      # no .nvmrc or engines field: Node 22 LTS (Vite 8 needs 20.19 or 22.12 and later)
      - name: Set up Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.12"

      - name: Install, type check and build
        run: python3 ../tools/dashboard_bundle.py build --commit "$GITHUB_SHA"

      - name: Unit, contract and build tests
        env:
          DASHBOARD_DIST_REQUIRED: "1"
        run: npm test

      - name: Size budget
        run: npm run test:size

      - name: Same commit, same bundle
        run: python3 ../tools/dashboard_bundle.py repro

      - name: Record and pack
        id: record
        run: |
          bundle="$(python3 -c 'import json; print(json.load(open("dist/bundle.json"))["sha256"])')"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/bundle"
          python3 ../tools/dashboard_bundle.py pack --out "$RUNNER_TEMP/bundle/tandemapp-dashboard-${bundle:0:16}.tar.gz"
          echo "dashboard bundle \`$bundle\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the page
        uses: actions/upload-artifact@v4.4.3
        with:
          name: dashboard-dist
          path: app/dashboard/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload the release archive
        uses: actions/upload-artifact@v4.4.3
        with:
          name: dashboard-bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 14
